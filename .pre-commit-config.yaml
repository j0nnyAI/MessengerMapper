# Pre-commit hooks for project repos. Extend with language-specific linters per stack.
# Vault updates are async via post-commit (see scripts/post-commit-context-update.py); there is no vault-blocking pre-commit gate in v2.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

